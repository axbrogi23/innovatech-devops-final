name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_EC2_BACK_IP }}
          username: ec2-user
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            docker stop innovatech_backend || true
            docker rm innovatech_backend || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest
            # Nota: Aquí puedes ejecutar el contenedor conectándolo a tu MySQL local de AWS
            docker run -d --name innovatech_backend -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest